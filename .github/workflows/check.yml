name: Academic System Auto-Check

on:
  schedule:
    - cron: '0 */2 * * *' # يعمل تلقائياً كل ساعتين
  workflow_dispatch: # يتيح لك تشغيله يدوياً في أي وقت من زر الموقع

jobs:
  check-updates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install google-genai requests beautifulsoup4

      - name: Run Python script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
         python .github/workflows/main.py
